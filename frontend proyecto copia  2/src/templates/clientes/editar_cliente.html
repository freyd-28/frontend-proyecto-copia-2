{% extends "layout/layout.html" %}

{% block contenido %}

<main class="main-content">

  <div class="container" style="max-width: 650px;">


<div class="card shadow-sm border">

  <div class="card-body p-4">

    <div class="mb-4">
      <h2 class="fw-bold mb-1">
        Editar Cliente
      </h2>

      <p class="text-muted mb-0">
        Modifica la información del cliente.
      </p>
    </div>

    <form
      method="POST"
      action="{{ url_for(
          'clientes.editar_cliente',
          cliente_id=cliente.id_cliente
      ) }}"
    >

      <!-- NOMBRE -->
      <div class="mb-3">

        <label
          for="nombre"
          class="form-label fw-semibold"
        >
          Nombre Completo / Razón Social
        </label>

        <input
          type="text"
          id="nombre"
          name="nombre"
          class="form-control"
          value="{{ cliente.nombre }}"
          required
        >

      </div>


      <!-- DOCUMENTO -->
      <div class="mb-3">

        <label
          for="documento"
          class="form-label fw-semibold"
        >
          Número de Identificación
        </label>

        <input
          type="text"
          id="documento"
          name="documento"
          class="form-control"
          value="{{ cliente.documento }}"
          required
        >

      </div>


      <!-- TELEFONO -->
      <div class="mb-3">

        <label
          for="telefono"
          class="form-label fw-semibold"
        >
          Teléfono
        </label>

        <input
          type="text"
          id="telefono"
          name="telefono"
          class="form-control"
          value="{{ cliente.telefono or '' }}"
        >

      </div>


      <!-- DIRECCION -->
      <div class="mb-4">

        <label
          for="direccion"
          class="form-label fw-semibold"
        >
          Dirección
        </label>

        <input
          type="text"
          id="direccion"
          name="direccion"
          class="form-control"
          value="{{ cliente.direccion or '' }}"
        >

      </div>


      <!-- BOTONES -->
      <div class="d-flex gap-2">

        <button
          type="submit"
          class="btn btn-warning fw-medium"
        >
          <i class="bi bi-check-lg me-1"></i>
          Guardar Cambios
        </button>

        <a
          href="{{ url_for('clientes.lista_clientes') }}"
          class="btn btn-secondary fw-medium"
        >
          Cancelar
        </a>

      </div>

    </form>

  </div>

</div>


  </div>

</main>

{% endblock %}
