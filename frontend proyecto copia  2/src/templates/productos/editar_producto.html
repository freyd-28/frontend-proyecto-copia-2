{% extends "layout/layout.html" %}

{% block title %}Editar producto | BilleterAPP{% endblock %}

{% block contenido %}
<div class="container-fluid px-0">
    <div class="card p-4 shadow-sm border" style="max-width:700px">
        <div class="mb-4">
            <h1 class="h3 fw-bold mb-1">Editar producto</h1>
            <p class="text-muted mb-0">Actualiza la información del producto.</p>
        </div>
        
        <form method="POST" action="{{ url_for('productos.editar_producto', producto_id=producto.id_producto) }}">
            <div class="mb-3">
                <label for="nombre" class="form-label fw-semibold">Nombre de la referencia</label>
                <input id="nombre" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
            </div>
            
            <div class="mb-3">
                <label for="precio_venta" class="form-label fw-semibold">Precio unitario</label>
                <input id="precio_venta" name="precio_venta" type="number" min="0.01" step="0.01" class="form-control" value="{{ producto.precio_venta }}" required>
            </div>
            
            <div class="mb-3">
                <label for="id_categoria" class="form-label fw-semibold">Categoría</label>
                <select id="id_categoria" name="id_categoria" class="form-select" required>
                    <option value="">Seleccione una categoría</option>
                    {% for categoria in categorias %}
                    <option value="{{ categoria.id_categoria }}" {% if producto.id_categoria|string == categoria.id_categoria|string %}selected{% endif %}>{{ categoria.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-4">
                <label for="activo" class="form-label fw-semibold">Estado</label>
                <select id="activo" name="activo" class="form-select">
                    <option value="1" {% if producto.activo|string == '1' %}selected{% endif %}>Activo</option>
                    <option value="0" {% if producto.activo|string == '0' %}selected{% endif %}>Inactivo</option>
                </select>
            </div>
            
            <div class="d-flex gap-2">
                <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Guardar cambios</button>
                <a class="btn btn-secondary" href="{{ url_for('productos.lista_productos') }}">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
