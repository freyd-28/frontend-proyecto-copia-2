{% extends "layout/layout.html" %}
{% block contenido %}
<div class="container p-4" style="max-width: 600px;">
  <div class="card p-4 shadow-sm border">
    <h2 class="fw-bold mb-4">Crear Nueva Factura</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('facturas.nueva_factura') }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Número de Factura</label>
        <input type="text" name="numero_factura" class="form-control" placeholder="Ej. FAC-0001" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Cliente</label>
        <select name="id_cliente" class="form-select" required>
          <option value="" disabled selected>Selecciona un cliente</option>
          {% for c in clientes %}
            <option value="{{ c.id_cliente }}">{{ c.nombre }} — {{ c.documento }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Producto</label>
        <select name="id_producto" class="form-select" required>
          <option value="" disabled selected>Selecciona un producto</option>
          {% for p in productos %}
            <option value="{{ p.id_producto }}">{{ p.nombre }} — $ {{ "{:,.2f}".format(p.precio_venta) }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Cantidad</label>
        <input type="number" name="cantidad" class="form-control" min="1" required>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success fw-medium">Registrar Venta</button>
        <a href="{{ url_for('facturas.lista_facturas') }}" class="btn btn-secondary fw-medium">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
